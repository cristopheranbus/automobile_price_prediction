data:
  data_path: data/automobile_dataset.csv
  target_column: Selling_Price
  categorical_columns:
    - Make
    - Model
    - Body_Type
    - Fuel_Type
    - Transmission
    - Engine_Size
    - Accident_History
  numeric_columns:
    - Year
    - Mileage
    - Horsepower
    - Torque
    - Owners
  test_size: 0.15
  validation_size: 0.15
  random_state: 42

training:
  experiment_name: automobile-price-prediction
  registered_model_name: automobile-price-predictor
  tracking_uri: null
  epochs: 300
  batch_size: null
  patience: 30
  learning_rate: 0.001
  use_early_stopping: true
  verbose_training: 0
  run_name: null
  experiments:
    - name: compact-baseline
      learning_rate: 0.001
      epochs: 250
      batch_size: null
      patience: 20
      architectures:
        - [16]
        - [32]
        - [64, 32]
      criterion_order: rmse_valid
      use_early_stopping: true

    - name: balanced-default
      learning_rate: 0.001
      epochs: 300
      batch_size: null
      patience: 30
      architectures:
        - [64, 32]
        - [128, 64]
        - [128, 64, 32]
      criterion_order: rmse_valid
      use_early_stopping: true

    - name: deeper-models
      learning_rate: 0.0005
      epochs: 350
      batch_size: null
      patience: 35
      architectures:
        - [128, 64, 32]
        - [128, 64, 32, 16]
      criterion_order: rmse_valid
      use_early_stopping: true
