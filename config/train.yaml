data:
  data_path: data/input/automobile_dataset.csv
  target_column: Selling_Price
  categorical_columns:
    - Make
    - Model
    - Body_Type
    - Fuel_Type
    - Transmission
    - Engine_Size
    - Accident_History
  numeric_columns:
    - Year
    - Mileage
    - Horsepower
    - Torque
    - Owners
  test_size: 0.15
  validation_size: 0.15
  random_state: 42

training:
  experiment_name: automobile-price-prediction
  registered_model_name: automobile-price-predictor
  tracking_uri: null
  tracking_dir: mlruns
  model_artifact_path: model
  config_artifact_path: config/config.json
  history_artifact_path: reports/final_training_history.json
  summary_artifact_path: reports/experiment_summary.json
  reports_artifact_dir: reports
  epochs: 1000
  batch_size: null
  patience: 50
  learning_rate: 0.001
  use_early_stopping: true
  verbose_training: 0
  run_name: null
  experiments:
    - name: wide-128
      learning_rate: 0.001
      epochs: 500
      batch_size: null
      patience: 35
      architectures:
        - [128]
        - [128, 64]
      criterion_order: rmse_valid
      use_early_stopping: true

    - name: balanced-32
      learning_rate: 0.001
      epochs: 750
      batch_size: null
      patience: 45
      architectures:
        - [128, 64]
        - [128, 64, 32]
      criterion_order: rmse_valid
      use_early_stopping: true

    - name: deep-16
      learning_rate: 0.0005
      epochs: 850
      batch_size: null
      patience: 50
      architectures:
        - [128, 64, 32, 16]
      criterion_order: rmse_valid
      use_early_stopping: true

    - name: max-depth-8
      learning_rate: 0.0005
      epochs: 1000
      batch_size: null
      patience: 60
      architectures:
        - [128, 64, 32, 16, 8]
      criterion_order: rmse_valid
      use_early_stopping: true
