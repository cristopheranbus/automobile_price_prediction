[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automobile-price-prediction"
version = "0.1.0"
description = "Automobile price prediction with reusable training utilities and MLflow."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mlflow",
  "numpy",
  "pandas",
  "pyyaml",
  "scikit-learn",
  "tensorflow",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[project.scripts]
automobile-train = "src.train:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
